# بناء التطبيق ونشره على GitHub Pages عند كل دفعة إلى main.
#
# مفاتيح Supabase تُحقن وقت البناء من أسرار المستودع، فلا يوجد ملف .env
# في الشيفرة. المفتاح المحقون هو المفتاح العام (publishable) وحده — وهو
# مخصّص للعمل داخل المتصفح، وحماية البيانات مصدرها سياسات RLS.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل مرة؛ الدفعات المتلاحقة تُلغي البناء الجاري.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
